<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário - Ponto Eletrônico</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-link {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.875rem;
    }

    .login-link a {
      color: var(--primary-color);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon">
          <i class="ph-bold ph-user-plus"></i>
        </div>
        <h1>Criar Conta</h1>
        <p>Preencha os dados abaixo para se cadastrar</p>
      </div>

      <div id="alert-message" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 6px; font-size: 0.875rem; background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;"></div>
      <div id="success-message" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 6px; font-size: 0.875rem; background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <div class="input-wrapper">
            <i class="ph ph-identification-card"></i>
            <input type="text" id="name" class="form-control" placeholder="Digite seu nome completo" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Usuário / Email</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope-simple"></i>
            <input type="text" id="email" class="form-control" placeholder="Digite seu usuário ou email" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <i class="ph ph-lock-key"></i>
            <input type="password" id="password" class="form-control" placeholder="Crie uma senha" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar Senha</label>
          <div class="input-wrapper">
            <i class="ph ph-check-circle"></i>
            <input type="password" id="confirm-password" class="form-control" placeholder="Repita a senha" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit">
          <i class="ph ph-user-plus"></i>
          Cadastrar
        </button>
      </form>

      <div class="login-link">
        <span>Já tem uma conta?</span>
        <a href="index.html">Faça Login</a>
      </div>

      <div class="auth-footer">
        <p>&copy; Sistema de Ponto Eletrônico Anti-Fraude</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
